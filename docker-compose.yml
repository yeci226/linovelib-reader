services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: false
      CAPTCHA_SOLVER: none
      TZ: Asia/Taipei
      # 解過 CF 的瀏覽器 session 最久保留多久 (毫秒) — 越長越省，但 cookie 過期會 fail
      BROWSER_TIMEOUT: 40000
    ports:
      - "8191:8191"
